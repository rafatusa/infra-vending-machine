version: 1
name: infra-vending-machine
vcs: github

rollback:
  strategy: manual

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 10
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/
      - name: Terraform Validate
        working-directory: infra
        run: |
          terraform init -input=false -backend=false
          terraform validate

  - id: provision
    kind: provision
    needs: [lint]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan
      - name: Get Outputs
        id: tf_outputs
        working-directory: infra
        run: |
          INSTANCE_IP=$(terraform output -raw ec2_public_ip 2>/dev/null || true)
          echo "instance_ip=${INSTANCE_IP:-none}" >> "$GITHUB_OUTPUT"

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Re-init and Read Outputs
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          INSTANCE_IP=$(terraform output -raw ec2_public_ip 2>/dev/null || true)
          echo "instance_ip=${INSTANCE_IP:-none}" >> "$GITHUB_OUTPUT"
      - name: Report
        run: |
          echo "Resources provisioned and configured via Terraform enterprise modules."
          echo "EC2 instance IP: ${{ steps.get_ip.outputs.instance_ip }}"

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Verify Resources Exist in State
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          terraform show -json | python3 -c "
          import sys, json
          state = json.load(sys.stdin)
          resources = state.get('values', {}).get('root_module', {}).get('resources', [])
          child_modules = state.get('values', {}).get('root_module', {}).get('child_modules', [])
          all_resources = list(resources)
          for cm in child_modules:
              all_resources.extend(cm.get('resources', []))
          print(f'Resources in state: {len(all_resources)}')
          for r in all_resources:
              print(f'  - {r[\"type\"]}.{r[\"name\"]} ({r[\"provider_name\"]})')
          if len(all_resources) == 0:
              print('INFO: No resources provisioned (all toggles are false)')
          "

  - id: vend-apply
    kind: custom
    needs: [verify]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Apply pending vend resources and close issues
        run: |
          if [ ! -d generated ]; then
            echo "No generated/ directory -- nothing to vend-apply."
            exit 0
          fi
          PENDING=$(find generated -mindepth 3 -maxdepth 3 -type d | while read -r d; do [ -f "${d}/.applied" ] || echo "${d}"; done | wc -l | tr -d ' ')
          if [ "${PENDING}" -eq 0 ]; then
            echo "All vend resources already applied -- nothing to do."
            exit 0
          fi
          APPLIED=0
          while IFS= read -r dir; do
            [ -f "${dir}/.applied" ] && continue
            ACCOUNT=$(echo "$dir" | cut -d/ -f2)
            ENV=$(echo "$dir"     | cut -d/ -f3)
            NAME=$(echo "$dir"    | cut -d/ -f4)
            echo "=== Applying: ${dir} (${ACCOUNT}/${ENV}/${NAME}) ==="
            APPLY_OK=true
            (
              set -o pipefail
              cd "${dir}"
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${TF_STATE_BUCKET}" \
                -backend-config="key=${ACCOUNT}/${ENV}/${NAME}/terraform.tfstate" \
                -backend-config="region=us-east-1"
              if grep -q "DESTROY" main.tf 2>/dev/null; then
                terraform destroy -input=false -auto-approve 2>&1 | tee /tmp/tf-apply.txt
              else
                terraform apply -input=false -auto-approve 2>&1 | tee /tmp/tf-apply.txt
              fi
            ) || APPLY_OK=false
            ISSUE_FILE="${dir}/.issue"
            if [ -f "${ISSUE_FILE}" ]; then
              ISSUE_NUM=$(cat "${ISSUE_FILE}")
              if [ "${APPLY_OK}" = "true" ]; then
                RESULT=$(tail -c 4000 /tmp/tf-apply.txt 2>/dev/null || echo "(no output)")
                printf 'SUCCESS: **%s** deployed successfully.\n\nTerraform output:\n```\n%s\n```\n' \
                  "${NAME}" "${RESULT}" > /tmp/comment.txt
                gh issue comment "${ISSUE_NUM}" \
                  --repo "$GITHUB_REPOSITORY" \
                  --body-file /tmp/comment.txt
                gh issue close "${ISSUE_NUM}" \
                  --repo "$GITHUB_REPOSITORY"
                gh label create vend-processed --color 0e8a16 \
                  --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
                gh issue edit "${ISSUE_NUM}" \
                  --repo "$GITHUB_REPOSITORY" \
                  --add-label "vend-processed" \
                  --remove-label "vend-pending" 2>/dev/null || true
                touch "${dir}/.applied"
                APPLIED=$((APPLIED + 1))
                echo "Done: ${dir}"
              else
                RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                printf 'FAILED: **%s** apply FAILED.\n\nCheck the [Actions run](%s) for details.\n' \
                  "${NAME}" "${RUN_URL}" > /tmp/comment.txt
                gh issue comment "${ISSUE_NUM}" \
                  --repo "$GITHUB_REPOSITORY" \
                  --body-file /tmp/comment.txt
                echo "FAILED: ${dir} -- apply error, .applied NOT written, issue left open."
                exit 1
              fi
            fi
          done < <(find generated -mindepth 3 -maxdepth 3 -type d | sort)
          echo "Total vend resources applied: ${APPLIED}"
      - name: Commit applied markers via GitHub API
        run: |
          upload_file_api() {
            local filepath="$1"
            local branch="main"
            local content
            content=$(base64 -w0 < "${filepath}")
            local existing_sha
            existing_sha=$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/${filepath}?ref=${branch}" \
              --jq '.sha' 2>/dev/null || echo "")
            if [ -n "${existing_sha}" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/contents/${filepath}" \
                -X PUT \
                -f message="vend: mark resource applied" \
                -f content="${content}" \
                -f branch="${branch}" \
                -f sha="${existing_sha}" > /dev/null
            else
              gh api "repos/${GITHUB_REPOSITORY}/contents/${filepath}" \
                -X PUT \
                -f message="vend: mark resource applied" \
                -f content="${content}" \
                -f branch="${branch}" > /dev/null
            fi
            echo "Uploaded: ${filepath}"
          }
          MARKERS=$(find generated -name '.applied' 2>/dev/null | wc -l | tr -d ' ')
          if [ "${MARKERS}" -gt 0 ]; then
            while IFS= read -r marker; do
              upload_file_api "${marker}"
            done < <(find generated -name '.applied' 2>/dev/null | sort)
            echo "Committed ${MARKERS} applied marker(s) via GitHub API."
          else
            echo "No new markers to commit."
          fi

destroy:
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform Init
      working-directory: infra
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
    - name: Terraform Destroy
      working-directory: infra
      run: terraform destroy -input=false -auto-approve

pipelines:
  - id: deploy-pulumi
    stages:
      - id: pulumi-lint
        kind: lint
        needs: []
        timeout_minutes: 15
        steps:
          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version: "1.22"
          - name: Go mod tidy
            working-directory: pulumi
            run: go mod tidy
          - name: Go vet
            working-directory: pulumi
            run: go vet ./...
          - name: Go build check
            working-directory: pulumi
            run: go build ./...

      - id: pulumi-provision
        kind: provision
        needs: [pulumi-lint]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CREATE_EC2: "true"
        steps:
          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version: "1.22"
          - name: Install Pulumi CLI
            uses: pulumi/actions@v5
          - name: Go mod tidy
            working-directory: pulumi
            run: go mod tidy
          - name: go mod download
            working-directory: pulumi
            run: go mod download
          - name: Install Pulumi AWS plugin
            working-directory: pulumi
            run: pulumi plugin install resource aws 6.83.4
          - name: Init stack (idempotent)
            working-directory: pulumi
            run: pulumi stack init prod --non-interactive 2>/dev/null || pulumi stack select prod --non-interactive
          - name: Set stack config
            working-directory: pulumi
            env:
              PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
              SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
            run: |
              pulumi config set projectName "${PROJECT_NAME}" --stack prod
              pulumi config set --secret sshPublicKey "${SSH_PUBLIC_KEY}" --stack prod
          - name: Pulumi up
            working-directory: pulumi
            run: pulumi up --yes --stack prod --non-interactive

      - id: pulumi-configure
        kind: configure
        needs: [pulumi-provision]
        timeout_minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        steps:
          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version: "1.22"
          - name: Install Pulumi CLI
            uses: pulumi/actions@v5
          - name: Go mod tidy
            working-directory: pulumi
            run: go mod tidy
          - name: Read stack outputs
            working-directory: pulumi
            run: |
              echo "=== Pulumi Stack Outputs ==="
              pulumi stack output --stack prod

      - id: pulumi-verify
        kind: verify
        needs: [pulumi-provision, pulumi-configure]
        timeout_minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        steps:
          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version: "1.22"
          - name: Install Pulumi CLI
            uses: pulumi/actions@v5
          - name: Go mod tidy
            working-directory: pulumi
            run: go mod tidy
          - name: Verify EC2 public IP exported
            working-directory: pulumi
            run: |
              PUBLIC_IP=$(pulumi stack output pulumi_ec2_public_ip --stack prod 2>/dev/null || true)
              if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "none" ]; then
                echo "WARNING: No EC2 public IP found"
              else
                echo "Pulumi EC2 public IP: ${PUBLIC_IP}"
              fi

  - id: destroy-pulumi
    stages:
      - id: pulumi-destroy
        kind: custom
        needs: []
        timeout_minutes: 20
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        steps:
          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version: "1.22"
          - name: Install Pulumi CLI
            uses: pulumi/actions@v5
          - name: Go mod tidy
            working-directory: pulumi
            run: go mod tidy
          - name: Install Pulumi AWS plugin
            working-directory: pulumi
            run: pulumi plugin install resource aws 6.83.4
          - name: Select stack
            working-directory: pulumi
            run: pulumi stack select prod --non-interactive
          - name: Pulumi destroy
            working-directory: pulumi
            run: pulumi destroy --yes --stack prod --non-interactive
          - name: Verify destroyed
            working-directory: pulumi
            run: |
              REMAINING=$(pulumi stack output --stack prod --json 2>/dev/null || echo "{}")
              echo "Remaining outputs: ${REMAINING}"

  - id: validate-resource
    stages:
      - id: vend-process
        kind: custom
        needs: []
        timeout_minutes: 45
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        steps:
          - name: Install engine dependencies
            run: pip install -r engine/requirements.txt

          - name: Find pending resource-request issue
            id: find_issue
            run: |
              ISSUE_NUM="${{ github.event.inputs.issue_number }}"
              if [ -z "${ISSUE_NUM}" ]; then
                ISSUE_NUM=$(gh issue list \
                  --repo "$GITHUB_REPOSITORY" \
                  --label resource-request \
                  --state open \
                  --json number,labels \
                  --jq '[.[] | select(.labels | map(.name) | index("vend-processed") | not) | select(.labels | map(.name) | index("vend-pending") | not)] | sort_by(.number) | .[0].number // empty')
              fi
              if [ -z "${ISSUE_NUM}" ]; then
                echo "No pending resource-request issues found. Nothing to do."
                echo "SKIP=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "SKIP=false" >> "$GITHUB_OUTPUT"
              echo "ISSUE_NUM=${ISSUE_NUM}" >> "$GITHUB_OUTPUT"
              echo "Processing issue #${ISSUE_NUM}"
              {
                echo "ISSUE_BODY<<GHADELIMITER"
                gh issue view "${ISSUE_NUM}" \
                  --repo "$GITHUB_REPOSITORY" --json body --jq '.body'
                echo "GHADELIMITER"
              } >> "$GITHUB_OUTPUT"

          - name: Parse issue body to request YAML
            id: parse
            env:
              ISSUE_BODY: ${{ steps.find_issue.outputs.ISSUE_BODY }}
            run: |
              [ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0
              python engine/parse_issue.py \
                "${{ steps.find_issue.outputs.ISSUE_NUM }}" requests >> "$GITHUB_OUTPUT"

          - name: Validate request against catalog
            run: |
              [ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0
              python engine/validate.py "${{ steps.parse.outputs.REQUEST_FILE }}"

          - name: Generate Terraform for CREATE or MODIFY
            id: generate
            run: |
              [ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0
              [ "${{ steps.parse.outputs.UDAP_ACTION }}" = "DESTROY" ] && exit 0
              python engine/generate.py \
                "${{ steps.parse.outputs.REQUEST_FILE }}" >> "$GITHUB_OUTPUT"

          - name: Prepare destroy config for DESTROY action
            id: destroy_prep
            run: |
              [ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0
              [ "${{ steps.parse.outputs.UDAP_ACTION }}" != "DESTROY" ] && exit 0
              ACCOUNT="${{ steps.parse.outputs.ACCOUNT }}"
              ENV="${{ steps.parse.outputs.ENVIRONMENT }}"
              NAME="${{ steps.parse.outputs.REQUEST_NAME }}"
              OUT_DIR="generated/${ACCOUNT}/${ENV}/${NAME}"
              echo "OUTPUT_DIR=${OUT_DIR}" >> "$GITHUB_OUTPUT"
              if [ -d "${OUT_DIR}" ]; then
                printf '# DESTROY -- no resources declared; apply destroys all state entries\n' \
                  > "${OUT_DIR}/main.tf"
              else
                echo "WARNING: ${OUT_DIR} not found -- nothing to destroy."
              fi

          - name: Publish branch and files via GitHub API
            id: branch
            run: |
              [ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0
              ISSUE_NUM="${{ steps.find_issue.outputs.ISSUE_NUM }}"
              NAME="${{ steps.parse.outputs.REQUEST_NAME }}"
              ACCOUNT="${{ steps.parse.outputs.ACCOUNT }}"
              ENV="${{ steps.parse.outputs.ENVIRONMENT }}"
              BRANCH="vend/${NAME}-${ISSUE_NUM}"
              echo "BRANCH=${BRANCH}" >> "$GITHUB_OUTPUT"
              OUT_DIR="generated/${ACCOUNT}/${ENV}/${NAME}"
              if [ -d "${OUT_DIR}" ]; then
                printf '%s' "${ISSUE_NUM}" > "${OUT_DIR}/.issue"
              fi
              MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
              echo "Main SHA: ${MAIN_SHA}"
              gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
                -X DELETE 2>/dev/null || true
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/heads/${BRANCH}" \
                -f sha="${MAIN_SHA}" > /dev/null
              echo "Branch ${BRANCH} ready."
              upload_file_api() {
                local filepath="$1"
                local content
                content=$(base64 -w0 < "${filepath}")
                local existing_sha
                existing_sha=$(gh api \
                  "repos/${GITHUB_REPOSITORY}/contents/${filepath}?ref=${BRANCH}" \
                  --jq '.sha' 2>/dev/null || echo "")
                if [ -n "${existing_sha}" ]; then
                  gh api "repos/${GITHUB_REPOSITORY}/contents/${filepath}" \
                    -X PUT \
                    -f message="vend: ${NAME} [#${ISSUE_NUM}]" \
                    -f content="${content}" \
                    -f branch="${BRANCH}" \
                    -f sha="${existing_sha}" > /dev/null
                else
                  gh api "repos/${GITHUB_REPOSITORY}/contents/${filepath}" \
                    -X PUT \
                    -f message="vend: ${NAME} [#${ISSUE_NUM}]" \
                    -f content="${content}" \
                    -f branch="${BRANCH}" > /dev/null
                fi
                echo "Uploaded: ${filepath}"
              }
              while IFS= read -r f; do
                upload_file_api "${f}"
              done < <(find "requests" -type f 2>/dev/null | sort)
              while IFS= read -r f; do
                upload_file_api "${f}"
              done < <(find "${OUT_DIR}" -type f 2>/dev/null | sort)

          - name: Setup Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_wrapper: false

          - name: Terraform init and plan
            id: plan
            run: |
              [ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0
              OUT_DIR="${{ steps.generate.outputs.OUTPUT_DIR }}"
              [ -z "${OUT_DIR}" ] && OUT_DIR="${{ steps.destroy_prep.outputs.OUTPUT_DIR }}"
              ACCOUNT="${{ steps.parse.outputs.ACCOUNT }}"
              ENV="${{ steps.parse.outputs.ENVIRONMENT }}"
              NAME="${{ steps.parse.outputs.REQUEST_NAME }}"
              echo "OUT_DIR=${OUT_DIR}" >> "$GITHUB_OUTPUT"
              if [ -z "${OUT_DIR}" ] || [ ! -d "${OUT_DIR}" ]; then
                echo "PLAN_EXIT=1" >> "$GITHUB_OUTPUT"
                echo "No generated directory found." > /tmp/tf-plan.txt
                exit 0
              fi
              cd "${OUT_DIR}"
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${ACCOUNT}/${ENV}/${NAME}/terraform.tfstate" \
                -backend-config="region=us-east-1"
              if terraform plan -input=false -no-color 2>&1 | tee /tmp/tf-plan.txt; then
                echo "PLAN_EXIT=0" >> "$GITHUB_OUTPUT"
              else
                echo "PLAN_EXIT=1" >> "$GITHUB_OUTPUT"
              fi

          - name: Open PR with plan output and request review
            id: open_pr
            env:
              ISSUE_NUM: ${{ steps.find_issue.outputs.ISSUE_NUM }}
              REQUEST_NAME: ${{ steps.parse.outputs.REQUEST_NAME }}
              UDAP_ACTION: ${{ steps.parse.outputs.UDAP_ACTION }}
              BRANCH: ${{ steps.branch.outputs.BRANCH }}
              PLAN_EXIT: ${{ steps.plan.outputs.PLAN_EXIT }}
              RESOURCE_TYPE: ${{ steps.parse.outputs.RESOURCE_TYPE }}
              ACCOUNT: ${{ steps.parse.outputs.ACCOUNT }}
              ENVIRONMENT: ${{ steps.parse.outputs.ENVIRONMENT }}
            run: |
              [ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0
              python3 engine/open_pr.py >> "$GITHUB_OUTPUT"

          - name: Label issue as vend-pending
            run: |
              [ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0
              gh label create vend-pending --color fbca04 \
                --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
              gh label create vend-processed --color 0e8a16 \
                --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
              gh issue edit "${{ steps.find_issue.outputs.ISSUE_NUM }}" \
                --repo "$GITHUB_REPOSITORY" \
                --add-label "vend-pending" 2>/dev/null || true
