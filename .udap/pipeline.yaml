version: 1
name: infra-vending-machine
vcs: github

rollback:
  strategy: manual

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 10
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/
      - name: Terraform Validate
        working-directory: infra
        run: |
          terraform init -input=false -backend=false
          terraform validate

  - id: provision
    kind: provision
    needs: [lint]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan
      - name: Get Outputs
        id: tf_outputs
        working-directory: infra
        run: |
          INSTANCE_IP=$(terraform output -raw ec2_public_ip 2>/dev/null || true)
          echo "instance_ip=${INSTANCE_IP:-none}" >> "$GITHUB_OUTPUT"

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Re-init and Read Outputs
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          INSTANCE_IP=$(terraform output -raw ec2_public_ip 2>/dev/null || true)
          echo "instance_ip=${INSTANCE_IP:-none}" >> "$GITHUB_OUTPUT"
      - name: Report
        run: |
          echo "Resources provisioned and configured via Terraform enterprise modules."
          echo "EC2 instance IP: ${{ steps.get_ip.outputs.instance_ip }}"

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Verify Resources Exist in State
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          terraform show -json | python3 -c "
          import sys, json
          state = json.load(sys.stdin)
          resources = state.get('values', {}).get('root_module', {}).get('resources', [])
          child_modules = state.get('values', {}).get('root_module', {}).get('child_modules', [])
          all_resources = list(resources)
          for cm in child_modules:
              all_resources.extend(cm.get('resources', []))
          print(f'Resources in state: {len(all_resources)}')
          for r in all_resources:
              print(f'  - {r[\"type\"]}.{r[\"name\"]} ({r[\"provider_name\"]})')
          if len(all_resources) == 0:
              print('INFO: No resources provisioned (all toggles are false — expected for initial run)')
          "

destroy:
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform Init
      working-directory: infra
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
    - name: Terraform Destroy
      working-directory: infra
      run: terraform destroy -input=false -auto-approve
