# Infra Vending Machine — EKS Resource Catalog Entry
# Teams may request EKS clusters within these constraints.

resource_type: EKS
module_source: "github.com/rafatusa/enterprise-infra-module//infra/modules/aws/eks?ref=v1.0.0"
description: AWS EKS cluster via enterprise-infra-module

defaults:
  kubernetes_version: "1.33"
  node_count: 2
  instance_type: t3.medium
  min_nodes: 1
  max_nodes: 5
  region: us-east-1

allowed_instance_types:
  - t3.medium
  - t3.large
  - t3.xlarge
  - m5.large
  - m5.xlarge
  - m5.2xlarge

allowed_environments:
  - DEV
  - STAGING
  - PROD

required_fields:
  - request_name
  - udap_action
  - resource_type
  - environment
  - account
  - region
  - vpc

# EKS rejects us-east-1e for control plane — always filter subnet AZs
eks_supported_azs:
  us-east-1:
    - us-east-1a
    - us-east-1b
    - us-east-1c
    - us-east-1d
    - us-east-1f
  us-west-2:
    - us-west-2a
    - us-west-2b
    - us-west-2c
    - us-west-2d
  eu-west-1:
    - eu-west-1a
    - eu-west-1b
    - eu-west-1c
