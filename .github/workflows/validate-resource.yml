name: validate-resource
'on':
  workflow_dispatch: {}
jobs:
  vend-process:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Install engine dependencies
      run: pip install -r engine/requirements.txt
    - id: find_issue
      name: Find pending resource-request issue
      run: "ISSUE_NUM=\"${{ github.event.inputs.issue_number }}\"\nif [ -z \"${ISSUE_NUM}\"\
        \ ]; then\n  ISSUE_NUM=$(gh issue list \\\n    --repo \"$GITHUB_REPOSITORY\"\
        \ \\\n    --label resource-request \\\n    --state open \\\n    --json number,labels\
        \ \\\n    --jq '[.[] | select(.labels | map(.name) | index(\"vend-processed\"\
        ) | not) | select(.labels | map(.name) | index(\"vend-pending\") | not)] |\
        \ sort_by(.number) | .[0].number // empty')\nfi\nif [ -z \"${ISSUE_NUM}\"\
        \ ]; then\n  echo \"No pending resource-request issues found. Nothing to do.\"\
        \n  echo \"SKIP=true\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\necho \"SKIP=false\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"ISSUE_NUM=${ISSUE_NUM}\" >> \"$GITHUB_OUTPUT\"\
        \necho \"Processing issue #${ISSUE_NUM}\"\n{\n  echo \"ISSUE_BODY<<GHADELIMITER\"\
        \n  gh issue view \"${ISSUE_NUM}\" \\\n    --repo \"$GITHUB_REPOSITORY\" --json\
        \ body --jq '.body'\n  echo \"GHADELIMITER\"\n} >> \"$GITHUB_OUTPUT\"\n"
    - id: parse
      name: Parse issue body to request YAML
      run: "[ \"${{ steps.find_issue.outputs.SKIP }}\" = \"true\" ] && exit 0\npython\
        \ engine/parse_issue.py \\\n  \"${{ steps.find_issue.outputs.ISSUE_NUM }}\"\
        \ requests >> \"$GITHUB_OUTPUT\"\n"
      env:
        ISSUE_BODY: ${{ steps.find_issue.outputs.ISSUE_BODY }}
    - name: Validate request against catalog
      run: '[ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0

        python engine/validate.py "${{ steps.parse.outputs.REQUEST_FILE }}"

        '
    - id: generate
      name: Generate Terraform for CREATE or MODIFY
      run: "[ \"${{ steps.find_issue.outputs.SKIP }}\" = \"true\" ] && exit 0\n[ \"\
        ${{ steps.parse.outputs.UDAP_ACTION }}\" = \"DESTROY\" ] && exit 0\npython\
        \ engine/generate.py \\\n  \"${{ steps.parse.outputs.REQUEST_FILE }}\" >>\
        \ \"$GITHUB_OUTPUT\"\n"
    - id: destroy_prep
      name: Prepare destroy config for DESTROY action
      run: "[ \"${{ steps.find_issue.outputs.SKIP }}\" = \"true\" ] && exit 0\n[ \"\
        ${{ steps.parse.outputs.UDAP_ACTION }}\" != \"DESTROY\" ] && exit 0\nACCOUNT=\"\
        ${{ steps.parse.outputs.ACCOUNT }}\"\nENV=\"${{ steps.parse.outputs.ENVIRONMENT\
        \ }}\"\nNAME=\"${{ steps.parse.outputs.REQUEST_NAME }}\"\nOUT_DIR=\"generated/${ACCOUNT}/${ENV}/${NAME}\"\
        \necho \"OUTPUT_DIR=${OUT_DIR}\" >> \"$GITHUB_OUTPUT\"\nif [ -d \"${OUT_DIR}\"\
        \ ]; then\n  printf '# DESTROY -- no resources declared; apply destroys all\
        \ state entries\\n' \\\n    > \"${OUT_DIR}/main.tf\"\n  : > \"${OUT_DIR}/outputs.tf\"\
        \n  : > \"${OUT_DIR}/data.tf\"\n  rm -f \"${OUT_DIR}/.applied\"\nelse\n  echo\
        \ \"WARNING: ${OUT_DIR} not found -- nothing to destroy.\"\nfi\n"
    - id: branch
      name: Publish branch and files via GitHub API
      run: "[ \"${{ steps.find_issue.outputs.SKIP }}\" = \"true\" ] && exit 0\nISSUE_NUM=\"\
        ${{ steps.find_issue.outputs.ISSUE_NUM }}\"\nNAME=\"${{ steps.parse.outputs.REQUEST_NAME\
        \ }}\"\nACCOUNT=\"${{ steps.parse.outputs.ACCOUNT }}\"\nENV=\"${{ steps.parse.outputs.ENVIRONMENT\
        \ }}\"\nBRANCH=\"vend/${NAME}-${ISSUE_NUM}\"\necho \"BRANCH=${BRANCH}\" >>\
        \ \"$GITHUB_OUTPUT\"\nOUT_DIR=\"generated/${ACCOUNT}/${ENV}/${NAME}\"\nif\
        \ [ -d \"${OUT_DIR}\" ]; then\n  printf '%s' \"${ISSUE_NUM}\" > \"${OUT_DIR}/.issue\"\
        \nfi\nMAIN_SHA=$(gh api \"repos/${GITHUB_REPOSITORY}/branches/main\" --jq\
        \ '.commit.sha')\necho \"Main SHA: ${MAIN_SHA}\"\ngh api \"repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}\"\
        \ \\\n  -X DELETE 2>/dev/null || true\ngh api \"repos/${GITHUB_REPOSITORY}/git/refs\"\
        \ \\\n  -f ref=\"refs/heads/${BRANCH}\" \\\n  -f sha=\"${MAIN_SHA}\" > /dev/null\n\
        echo \"Branch ${BRANCH} ready.\"\nupload_file_api() {\n  local filepath=\"\
        $1\"\n  local content\n  content=$(base64 -w0 < \"${filepath}\")\n  local\
        \ existing_sha\n  existing_sha=$(gh api \\\n    \"repos/${GITHUB_REPOSITORY}/contents/${filepath}?ref=${BRANCH}\"\
        \ \\\n    --jq '.sha' 2>/dev/null || echo \"\")\n  if [ -n \"${existing_sha}\"\
        \ ]; then\n    gh api \"repos/${GITHUB_REPOSITORY}/contents/${filepath}\"\
        \ \\\n      -X PUT \\\n      -f message=\"vend: ${NAME} [#${ISSUE_NUM}]\"\
        \ \\\n      -f content=\"${content}\" \\\n      -f branch=\"${BRANCH}\" \\\
        \n      -f sha=\"${existing_sha}\" > /dev/null\n  else\n    gh api \"repos/${GITHUB_REPOSITORY}/contents/${filepath}\"\
        \ \\\n      -X PUT \\\n      -f message=\"vend: ${NAME} [#${ISSUE_NUM}]\"\
        \ \\\n      -f content=\"${content}\" \\\n      -f branch=\"${BRANCH}\" >\
        \ /dev/null\n  fi\n  echo \"Uploaded: ${filepath}\"\n}\nwhile IFS= read -r\
        \ f; do\n  upload_file_api \"${f}\"\ndone < <(find \"requests\" -type f 2>/dev/null\
        \ | sort)\nwhile IFS= read -r f; do\n  upload_file_api \"${f}\"\ndone < <(find\
        \ \"${OUT_DIR}\" -type f 2>/dev/null | sort)\n"
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - id: plan
      name: Terraform init and plan
      run: "[ \"${{ steps.find_issue.outputs.SKIP }}\" = \"true\" ] && exit 0\nOUT_DIR=\"\
        ${{ steps.generate.outputs.OUTPUT_DIR }}\"\n[ -z \"${OUT_DIR}\" ] && OUT_DIR=\"\
        ${{ steps.destroy_prep.outputs.OUTPUT_DIR }}\"\nACCOUNT=\"${{ steps.parse.outputs.ACCOUNT\
        \ }}\"\nENV=\"${{ steps.parse.outputs.ENVIRONMENT }}\"\nNAME=\"${{ steps.parse.outputs.REQUEST_NAME\
        \ }}\"\necho \"OUT_DIR=${OUT_DIR}\" >> \"$GITHUB_OUTPUT\"\nif [ -z \"${OUT_DIR}\"\
        \ ] || [ ! -d \"${OUT_DIR}\" ]; then\n  echo \"PLAN_EXIT=1\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"No generated directory found.\" > /tmp/tf-plan.txt\n  exit 0\n\
        fi\ncd \"${OUT_DIR}\"\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${ACCOUNT}/${ENV}/${NAME}/terraform.tfstate\"\
        \ \\\n  -backend-config=\"region=us-east-1\"\nif terraform plan -input=false\
        \ -no-color 2>&1 | tee /tmp/tf-plan.txt; then\n  echo \"PLAN_EXIT=0\" >> \"\
        $GITHUB_OUTPUT\"\nelse\n  echo \"PLAN_EXIT=1\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - id: open_pr
      name: Open PR with plan output and request review
      run: '[ "${{ steps.find_issue.outputs.SKIP }}" = "true" ] && exit 0

        python3 engine/open_pr.py >> "$GITHUB_OUTPUT"

        '
      env:
        ISSUE_NUM: ${{ steps.find_issue.outputs.ISSUE_NUM }}
        REQUEST_NAME: ${{ steps.parse.outputs.REQUEST_NAME }}
        UDAP_ACTION: ${{ steps.parse.outputs.UDAP_ACTION }}
        BRANCH: ${{ steps.branch.outputs.BRANCH }}
        PLAN_EXIT: ${{ steps.plan.outputs.PLAN_EXIT }}
        RESOURCE_TYPE: ${{ steps.parse.outputs.RESOURCE_TYPE }}
        ACCOUNT: ${{ steps.parse.outputs.ACCOUNT }}
        ENVIRONMENT: ${{ steps.parse.outputs.ENVIRONMENT }}
    - name: Label issue as vend-pending
      run: "[ \"${{ steps.find_issue.outputs.SKIP }}\" = \"true\" ] && exit 0\ngh\
        \ label create vend-pending --color fbca04 \\\n  --repo \"$GITHUB_REPOSITORY\"\
        \ 2>/dev/null || true\ngh label create vend-processed --color 0e8a16 \\\n\
        \  --repo \"$GITHUB_REPOSITORY\" 2>/dev/null || true\ngh issue edit \"${{\
        \ steps.find_issue.outputs.ISSUE_NUM }}\" \\\n  --repo \"$GITHUB_REPOSITORY\"\
        \ \\\n  --add-label \"vend-pending\" 2>/dev/null || true\n"
