name: apply-resource
'on':
  workflow_dispatch: {}
jobs:
  vend-apply:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Apply all pending generated resources
      run: "if [ ! -d generated ]; then\n  echo \"No generated/ directory -- nothing\
        \ to apply.\"\n  exit 0\nfi\nAPPLIED=0\nwhile IFS= read -r dir; do\n  [ -f\
        \ \"${dir}/.applied\" ] && continue\n  ACCOUNT=$(echo \"$dir\" | cut -d/ -f2)\n\
        \  ENV=$(echo \"$dir\"     | cut -d/ -f3)\n  NAME=$(echo \"$dir\"    | cut\
        \ -d/ -f4)\n  echo \"=== Applying: ${dir} (${ACCOUNT}/${ENV}/${NAME}) ===\"\
        \n  (\n    cd \"${dir}\"\n    terraform init -input=false -reconfigure \\\n\
        \      -backend-config=\"bucket=${TF_STATE_BUCKET}\" \\\n      -backend-config=\"\
        key=${ACCOUNT}/${ENV}/${NAME}/terraform.tfstate\" \\\n      -backend-config=\"\
        region=us-east-1\"\n    if grep -q \"DESTROY\" main.tf 2>/dev/null; then\n\
        \      terraform destroy -input=false -auto-approve\n    else\n      terraform\
        \ apply -input=false -auto-approve\n    fi\n  )\n  touch \"${dir}/.applied\"\
        \n  APPLIED=$((APPLIED + 1))\n  echo \"Done: ${dir}\"\ndone < <(find generated\
        \ -mindepth 3 -maxdepth 3 -type d | sort)\necho \"Total resources applied:\
        \ ${APPLIED}\"\n"
    - name: Commit applied markers
      run: "MARKERS=$(find generated -name '.applied' 2>/dev/null | wc -l | tr -d\
        \ ' ')\nif [ \"${MARKERS}\" -gt 0 ]; then\n  git config user.name  \"github-actions[bot]\"\
        \n  git config user.email \"github-actions[bot]@users.noreply.github.com\"\
        \n  find generated -name '.applied' | xargs git add 2>/dev/null || true\n\
        \  git diff --cached --quiet || \\\n    git commit -m \"vend: mark ${MARKERS}\
        \ resource(s) applied\"\n  git push origin main\nelse\n  echo \"No new markers\
        \ to commit.\"\nfi\n"
