    - uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Install Pulumi CLI
      uses: pulumi/actions@v5
    - name: go mod download
      run: go mod download
      working-directory: pulumi
    - name: Pulumi up
      run: pulumi up --yes --stack prod --non-interactive
