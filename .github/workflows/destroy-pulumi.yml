# edit by hand; change the spec and re-render.
name: destroy-pulumi
'on':
  workflow_dispatch: {}
jobs:
  pulumi-destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Install Pulumi CLI
      uses: pulumi/actions@v5
    - name: Go mod tidy
      run: go mod tidy
      working-directory: pulumi
    - name: Install Pulumi AWS plugin
      run: pulumi plugin install resource aws 6.83.4
      working-directory: pulumi
    - name: Select stack
      run: pulumi stack select prod --non-interactive
      working-directory: pulumi
    - name: Pulumi destroy
      run: pulumi destroy --yes --stack prod --non-interactive
      working-directory: pulumi
    - name: Verify destroyed
      run: 'REMAINING=$(pulumi stack output --stack prod --json 2>/dev/null || echo
        "{}")

        echo "Remaining outputs: ${REMAINING}"

        echo "Pulumi EC2 destroyed successfully"

        '
      working-directory: pulumi
