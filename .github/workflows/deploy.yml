      working-directory: infra
    - name: Tag Resources as Configured
      run: 'echo "Resources provisioned and tagged via Terraform module."

        echo "Instance IP: ${{ steps.get_ip.outputs.instance_ip }}"

        '
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    timeout-minutes: 15
