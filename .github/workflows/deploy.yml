    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform Format Check
      run: terraform fmt -check -recursive infra/
    - name: Terraform Validate
      run: 'terraform init -input=false -backend=false

        terraform validate

        '
      working-directory: infra
  provision:
    runs-on: ubuntu-latest
    needs:
    - lint
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform Init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform Plan
      run: terraform plan -input=false -out=tfplan
      working-directory: infra
    - name: Terraform Apply
      run: terraform apply -input=false -auto-approve tfplan
      working-directory: infra
    - id: tf_outputs
      name: Get Outputs
      run: 'INSTANCE_IP=$(terraform output -raw ec2_public_ip 2>/dev/null || true)

        echo "instance_ip=${INSTANCE_IP:-none}" >> "$GITHUB_OUTPUT"

        '
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - id: get_ip
      name: Re-init and Read Outputs
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
